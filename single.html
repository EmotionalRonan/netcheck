      --primary-hover: #1d4ed8;
      --border-color: #e2e8f0;

      --status-fail-bg: #fef2f2;

      --lat-med: #d97706;
      --lat-bad: #dc2626;

      --bg-card: #151d2a;
      --bg-header: #030712;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #1e293b;

      --status-success-border: #166534;
      --status-fail-bg: #3b1212;
      --status-fail-border: #991b1b;
    }

    header { background: var(--bg-header); color: #fff; padding: 0.9rem 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%; }
    .header-content { width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .logo-area { display: flex; align-items: center; gap: 0.6rem; }
    .logo-icon { font-size: 1.6rem; }
    .logo-title h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    .logo-title p { font-size: 0.78rem; color: #94a3b8; margin-top: 1px; }
    .header-actions { display: flex; align-items: center; gap: 0.8rem; }
    .search-box { position: relative; }
    .search-box input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 0.45rem 0.8rem 0.45rem 2rem; color: #fff; font-size: 0.85rem; width: 250px; outline: none; transition: all 0.2s; }
    .search-box input::placeholder { color: #94a3b8; }
    .search-box input:focus { background: rgba(255,255,255,0.18); border-color: var(--primary); width: 300px; }
    .search-icon { position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%); font-size: 0.85rem; opacity: 0.6; }
    .btn-action { background: var(--primary); color: #fff; border: none; padding: 0.45rem 0.95rem; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 0.35rem; transition: all 0.2s; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }
    .btn-action:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-add { background: #10b981; box-shadow: 0 2px 8px rgba(16,185,129,0.3); }
    .btn-add:hover { background: #059669; }
    .btn-reset { background: transparent; border: none; color: #94a3b8; font-size: 0.78rem; cursor: pointer; text-decoration: underline; transition: color 0.2s; }
    .btn-reset:hover { color: #ef4444; }
    .dark-toggle { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; user-select: none; font-size: 0.82rem; color: #cbd5e1; }
    .main-wrapper { width: 100%; padding: 1rem 1.2rem; flex: 1; }
    .category-tabs { display: flex; align-items: center; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.6rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border-color); scrollbar-width: thin; width: 100%; }
    .tab-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.4rem 0.85rem; border-radius: 20px; font-size: 0.82rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 0.35rem; }
    .tab-btn:hover, .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tab-btn .count { background: rgba(0,0,0,0.08); padding: 0.05rem 0.4rem; border-radius: 10px; font-size: 0.72rem; }
    .tab-btn.active .count { background: rgba(255,255,255,0.25); }
    .nav-section { margin-bottom: 1.5rem; width: 100%; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
    .section-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; width: 100%; }
    .nav-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.5rem 0.65rem; text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.15s ease-out; position: relative; overflow: hidden; }
    .nav-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); border-color: var(--primary); }
    .nav-card.hidden { display: none !important; }
    .card-del-btn { position: absolute; top: 3px; right: 3px; background: rgba(239, 68, 68, 0.85); color: white; border: none; width: 18px; height: 18px; border-radius: 50%; font-size: 12px; font-weight: bold; line-height: 18px; text-align: center; cursor: pointer; opacity: 0; transition: opacity 0.2s, background 0.2s; z-index: 20; }
    .nav-card:hover .card-del-btn { opacity: 1; }
    .card-del-btn:hover { background: #dc2626; transform: scale(1.1); }
    .card-top { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; padding-right: 12px; }
    .card-icon { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; background: #f1f5f9; flex-shrink: 0; }
    .card-info { overflow: hidden; }
    .card-name { font-weight: 600; font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
    .card-domain { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .card-bottom { display: flex; align-items: center; justify-content: space-between; border-top: 1px dashed var(--border-color); padding-top: 0.3rem; margin-top: 0.2rem; font-size: 0.7rem; }
    .status-badge { display: flex; align-items: center; justify-content: space-between; width: 100%; color: var(--text-muted); }
    .status-val { font-weight: 700; }
    .status-val.ok { color: #16a34a; }
    .status-val.fail { color: #dc2626; }
    .lat-val { font-size: 0.68rem; font-weight: 600; }
    .lat-val.good { color: var(--lat-good); }
    .lat-val.med { color: var(--lat-med); }
    .lat-val.bad { color: var(--lat-bad); }
    .nav-card.status-success { background-color: var(--status-success-bg); border-color: var(--status-success-border); }
    .nav-card.status-fail { background-color: var(--status-fail-bg); border-color: var(--status-fail-border); }
    .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-backdrop.show { opacity: 1; pointer-events: auto; }
    .modal-card { background: var(--bg-card); border-radius: 12px; width: 90%; max-width: 440px; padding: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); color: var(--text-main); }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }
    .form-group { margin-bottom: 0.9rem; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.5rem 0.8rem; font-size: 0.85rem; border: 1px solid var(--border-color); border-radius: 6px; outline: none; background: var(--bg-body); color: var(--text-main); }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.2rem; }
    footer { text-align: center; padding: 1.2rem 1rem; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border-color); margin-top: auto; }

        </div>
        <div class="form-group">
          <label>域名 (Domain)</label>

        </div>
        <div class="form-group">
          <label>所属分类</label>

            <option value="ai">🤖 AI与大模型</option>
            <option value="dev" selected>🛠️ 软件开发与框架</option>
            <option value="mirrors">📦 包管理器与开源镜像</option>
            <option value="cloud">☁️ 云服务 & DevOps</option>
            <option value="media_news">📰 新闻与主流媒体</option>
            <option value="social">💬 社交与社区媒体</option>
            <option value="sharing">📂 资源分享与网盘存储</option>
            <option value="portal_cn">🇨🇳 国内综合门户</option>
            <option value="portal_intl">🌍 国际综合门户</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-action" style="background:#64748b" id="modalCancelBtn">取消</button>
          <button type="submit" class="btn-action btn-add">确定保存</button>
        </div>
      </form>
    </div>
  </div>
