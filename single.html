<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link id="favicon" rel="icon" type="image/svg+xml" />
  <link id="manifestLink" rel="manifest" />
  <link id="appleTouchIcon" rel="apple-touch-icon" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GeekNav" />
  <title>极客开发导航 & 连通性测试中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                   "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

      /* Light — Apple-esque neutral palette */
      --bg-body: #f5f5f7;
      --bg-grid: rgba(0,0,0,0.035);
      --bg-glow-primary: rgba(0,113,227,0.20);
      --bg-glow-accent: rgba(52,199,89,0.16);
      --bg-glow-violet: rgba(124,77,255,0.13);
      --bg-card: rgba(255,255,255,0.72);
      --bg-card-solid: #ffffff;
      --text-main: #1d1d1f;
      --text-muted: #6e6e73;
      --text-faint: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --accent-press: #0062c4;
      --border-color: rgba(0,0,0,0.10);
      --fill-quiet: rgba(0,0,0,0.05);

      --material: rgba(255,255,255,0.72);
      --material-strong: rgba(255,255,255,0.85);
      --shadow-soft: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.06);
      --shadow-lift: 0 4px 12px rgba(0,0,0,0.10), 0 16px 40px rgba(0,0,0,0.12);

      --status-ok: #34c759;
      --status-bad: #ff3b30;
      --status-pending: #aeaeb2;
      --lat-good: #34c759;
      --lat-med: #ff9f0a;
      --lat-bad: #ff3b30;

      --green-wash: rgba(52,199,89,0.10);
      --red-wash: rgba(255,59,48,0.10);

      --radius-card: 18px;
      --radius-pill: 980px;
    }

    body.dark {
      --bg-body: #000000;
      --bg-grid: rgba(255,255,255,0.045);
      --bg-glow-primary: rgba(41,151,255,0.30);
      --bg-glow-accent: rgba(52,199,89,0.18);
      --bg-glow-violet: rgba(124,77,255,0.22);
      --bg-card: rgba(28,28,30,0.72);
      --bg-card-solid: #1c1c1e;
      --text-main: #f5f5f7;
      --text-muted: #98989d;
      --text-faint: #8e8e93;
      --accent: #2997ff;
      --accent-hover: #47a5ff;
      --accent-press: #0077ed;
      --border-color: rgba(255,255,255,0.12);
      --fill-quiet: rgba(255,255,255,0.08);

      --material: rgba(28,28,30,0.70);
      --material-strong: rgba(28,28,30,0.85);
      --shadow-soft: 0 1px 3px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.4);
      --shadow-lift: 0 4px 12px rgba(0,0,0,0.5), 0 16px 40px rgba(0,0,0,0.55);

      --green-wash: rgba(52,199,89,0.16);
      --red-wash: rgba(255,59,48,0.16);
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* 固定背景层：网格 + 跟随鼠标的光晕（GPU 合成，滚动不重绘） */
    .bg-fx {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background-color: var(--bg-body);
      background-image:
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
      background-size: 34px 34px;
      transition: background-color 0.4s ease;
    }
    .bg-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      filter: blur(70px);
      will-change: transform;
      transition: background-color 0.4s ease;
    }
    .bg-glow-a { width: 62vmax; height: 62vmax; background: var(--bg-glow-primary); }
    .bg-glow-b { width: 46vmax; height: 46vmax; background: var(--bg-glow-violet); }
    .bg-glow-c { width: 42vmax; height: 42vmax; background: var(--bg-glow-accent); }

    /* ---------- Header / Floating material bar ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--material);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--border-color);
    }
    header::after {
      /* gentle fade where content meets the bar */
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -14px;
      height: 14px;
      pointer-events: none;
      background: linear-gradient(to bottom, var(--material), transparent);
    }

    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }
    .logo-icon {
      font-size: 1.5rem;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      background: var(--fill-quiet);
      border-radius: 11px;
      flex-shrink: 0;
    }
    .logo-title h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .logo-title p {
      font-size: 0.74rem;
      color: var(--text-faint);
      margin-top: 1px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box input {
      background: var(--fill-quiet);
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      padding: 0.5rem 0.9rem 0.5rem 2.1rem;
      color: var(--text-main);
      font-size: 0.85rem;
      font-family: inherit;
      width: 220px;
      outline: none;
      transition: width 0.3s cubic-bezier(0.32,0.72,0,1), background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input::placeholder { color: var(--text-faint); }
    .search-box input:focus {
      width: 280px;
      background: var(--bg-card-solid);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0,113,227,0.15);
    }
    .search-icon {
      position: absolute;
      left: 0.75rem;
      font-size: 0.8rem;
      opacity: 0.5;
      pointer-events: none;
    }

    .btn {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-pill);
      padding: 0.5rem 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: transform 0.12s ease-out, background 0.2s, filter 0.2s;
      color: #fff;
      background: var(--accent);
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.96); background: var(--accent-press); }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(0,113,227,0.35); }

    .btn-add { background: var(--status-ok); }
    .btn-add:hover { filter: brightness(1.05); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      font-weight: 400;
    }
    .btn-ghost:hover { background: var(--fill-quiet); color: var(--text-main); }

    .dark-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 0.45rem 0.7rem;
      border-radius: var(--radius-pill);
      transition: background 0.2s, color 0.2s;
    }
    .dark-toggle:hover { background: var(--fill-quiet); color: var(--text-main); }
    .dark-toggle input { accent-color: var(--accent); }

    /* ---------- Main ---------- */
    .main-wrapper {
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      padding: 1.4rem 1.25rem 2.5rem;
      flex: 1;
    }

    /* Category tabs: wrap on desktop, horizontal scroll on small screens */
    .category-tabs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.2rem 0 0.9rem;
      margin-bottom: 1.1rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--fill-quiet);
      border: none;
      color: var(--text-main);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      scroll-snap-align: start;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: transform 0.12s ease-out, background 0.22s, color 0.22s;
    }
    .tab-btn:hover { background: rgba(0,0,0,0.09); }
    .tab-btn:active { transform: scale(0.95); }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .dark .tab-btn:hover { background: rgba(255,255,255,0.14); }
    .tab-btn .count {
      background: rgba(0,0,0,0.08);
      padding: 0.05rem 0.42rem;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
    }
    .tab-btn.active .count { background: rgba(255,255,255,0.25); }

    /* ---------- Sections & cards ---------- */
    .nav-section {
      margin-bottom: 1.8rem;
      content-visibility: auto;
      contain-intrinsic-size: auto 300px;
    }
    .section-header { margin-bottom: 0.75rem; }
    .section-title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 0.5rem;
    }

    /* Liquid Glass 卡片 */
    .nav-card {
      position: relative;
      background: linear-gradient(160deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.14) 40%, rgba(255,255,255,0.24) 100%);
      -webkit-backdrop-filter: blur(18px) saturate(220%) brightness(1.05);
      backdrop-filter: blur(18px) saturate(220%) brightness(1.05);
      border: none;
      border-radius: 16px;
      padding: 0.5rem 0.55rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.4rem;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.75),
        inset 0 -12px 28px rgba(255,255,255,0.14),
        inset 0 0 0 0.5px rgba(255,255,255,0.25),
        0 8px 32px rgba(0,0,0,0.08);
      transition: transform 0.18s cubic-bezier(0.32,0.72,0,1), box-shadow 0.18s, background 0.3s;
      min-height: 64px;
    }
    /* 液态渐变描边 */
    .nav-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(160deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.15) 35%, rgba(255,255,255,0.6) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    /* 悬停流光扫过 */
    .nav-card::after {
      content: "";
      position: absolute;
      top: -10%; bottom: -10%;
      left: -70%;
      width: 45%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: skewX(-18deg);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease, left 0.7s ease;
    }
    .nav-card:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.85),
        inset 0 -12px 28px rgba(255,255,255,0.18),
        var(--shadow-lift);
    }
    .nav-card:hover::after {
      opacity: 1;
      left: 135%;
    }
    .nav-card:active { transform: translateY(-1px) scale(0.985); }

    .nav-card.hidden { display: none !important; }

    .nav-card.status-success {
      background: linear-gradient(160deg, rgba(52,199,89,0.30) 0%, rgba(52,199,89,0.08) 100%);
    }
    .nav-card.status-success::before {
      background: linear-gradient(160deg, rgba(52,199,89,0.9) 0%, rgba(52,199,89,0.25) 40%, rgba(52,199,89,0.6) 100%);
    }
    .nav-card.status-fail {
      background: linear-gradient(160deg, rgba(255,59,48,0.28) 0%, rgba(255,59,48,0.06) 100%);
    }
    .nav-card.status-fail::before {
      background: linear-gradient(160deg, rgba(255,59,48,0.9) 0%, rgba(255,59,48,0.22) 40%, rgba(255,59,48,0.6) 100%);
    }

    .dark .nav-card {
      background: linear-gradient(160deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.09) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.26),
        inset 0 0 0 0.5px rgba(255,255,255,0.12),
        0 8px 32px rgba(0,0,0,0.5);
    }
    .dark .nav-card::before {
      background: linear-gradient(160deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.3) 100%);
    }
    .dark .nav-card::after {
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.22), transparent);
    }
    .dark .nav-card:hover {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        var(--shadow-lift);
    }
    .dark .nav-card.status-success {
      background: linear-gradient(160deg, rgba(52,199,89,0.26) 0%, rgba(52,199,89,0.06) 100%);
    }
    .dark .nav-card.status-fail {
      background: linear-gradient(160deg, rgba(255,59,48,0.24) 0%, rgba(255,59,48,0.05) 100%);
    }

    .card-del-btn {
      position: absolute;
      top: 4px; right: 4px;
      background: rgba(120,120,128,0.18);
      color: var(--text-main);
      border: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.2s, transform 0.2s, background 0.2s;
      z-index: 20;
      display: grid; place-items: center;
    }
    .nav-card:hover .card-del-btn,
    .nav-card:focus-within .card-del-btn { opacity: 1; transform: scale(1); }
    .card-del-btn:hover { background: rgba(255,59,48,0.9); color: #fff; }
    .card-del-btn:active { transform: scale(0.9); }

    .card-top {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding-right: 16px;
    }
    .card-icon {
      width: 24px; height: 24px;
      border-radius: 7px;
      object-fit: contain;
      background: var(--fill-quiet);
      flex-shrink: 0;
      padding: 2px;
    }
    .card-info { overflow: hidden; min-width: 0; }
    .card-name {
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .card-domain {
      font-size: 0.66rem;
      color: var(--text-faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 0.5px solid var(--border-color);
      padding-top: 0.35rem;
      font-size: 0.66rem;
      color: var(--text-muted);
    }
    .status-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 0.4rem;
    }
    .status-val { font-weight: 600; }
    .status-val.ok { color: var(--status-ok); }
    .status-val.fail { color: var(--status-bad); }
    .status-val.pending { color: var(--status-pending); }
    .lat-val {
      font-size: 0.72rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .lat-val.good { color: var(--lat-good); }
    .lat-val.med { color: var(--lat-med); }
    .lat-val.bad { color: var(--lat-bad); }

    /* ---------- Modal ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-backdrop.show { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--material-strong);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border: 0.5px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
      box-shadow: var(--shadow-lift);
      color: var(--text-main);
      transform: scale(0.94) translateY(8px);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1), opacity 0.25s ease;
    }
    .modal-backdrop.show .modal-card { transform: scale(1) translateY(0); opacity: 1; }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      background: var(--fill-quiet);
      border: none;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.2s, transform 0.12s;
    }
    .modal-close:hover { background: rgba(0,0,0,0.12); }
    .modal-close:active { transform: scale(0.9); }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      background: var(--bg-card-solid);
      color: var(--text-main);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0,113,227,0.15);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
      margin-top: 1.4rem;
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-faint);
      font-size: 0.78rem;
      border-top: 0.5px solid var(--border-color);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 720px) {
      .header-content {
        padding: 0.7rem 0.9rem;
        gap: 0.7rem;
      }
      .logo-title p { display: none; }
      .search-box input { width: 130px; }
      .search-box input:focus { width: 160px; }
      .header-actions { width: 100%; justify-content: flex-start; }
      .main-wrapper { padding: 1.1rem 0.9rem 2rem; }
      .cards-grid { grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 0.45rem; }
      .card-icon { width: 22px; height: 22px; }
    }
    @media (max-width: 420px) {
      .cards-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .logo-title h1 { font-size: 0.95rem; max-width: 52vw; }
    }
    @media (min-width: 1440px) {
      .header-content { max-width: 1680px; }
      .cards-grid { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
    }
    @media (min-width: 1920px) {

    function saveResourceDataset(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch (e) { console.error('Failed to save dataset to localStorage', e); }
    }

    let currentResourceData = loadResourceDataset();

    const searchInput = document.getElementById('searchInput');
    const testBtn = document.getElementById('testBtn');
    const resetBtn = document.getElementById('resetBtn');
    const addSiteBtn = document.getElementById('addSiteBtn');
    const darkToggle = document.getElementById('darkModeToggle');
    const categoryTabs = document.getElementById('categoryTabs');
    const navSections = document.getElementById('navSections');

    const addModal = document.getElementById('addModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const addSiteForm = document.getElementById('addSiteForm');

    const FALLBACK_ICON = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>";

    function renderNavGrid() {
      navSections.innerHTML = '';

      const counts = { all: currentResourceData.length };
      Object.keys(categoryMap).forEach(cat => counts[cat] = 0);
      currentResourceData.forEach(item => { if (counts[item.cat] !== undefined) counts[item.cat]++; });

      document.getElementById('countAll').textContent = counts.all;
      document.getElementById('countSearch').textContent = counts.search || 0;
      document.getElementById('countAi').textContent = counts.ai || 0;
      document.getElementById('countDev').textContent = counts.dev || 0;
      document.getElementById('countMirrors').textContent = counts.mirrors || 0;
      document.getElementById('countCloud').textContent = counts.cloud || 0;
      document.getElementById('countNews').textContent = counts.media_news || 0;
      document.getElementById('countSocial').textContent = counts.social || 0;
      document.getElementById('countSharing').textContent = counts.sharing || 0;
      document.getElementById('countNetwork').textContent = counts.network || 0;
      document.getElementById('countCn').textContent = counts.portal_cn || 0;
      document.getElementById('countIntl').textContent = counts.portal_intl || 0;

      Object.keys(categoryMap).forEach(catKey => {
        const catItems = currentResourceData.filter(d => d.cat === catKey);
        if (catItems.length === 0) return;

        const section = document.createElement('div');
        section.className = 'nav-section';
        section.dataset.category = catKey;
        section.innerHTML = `
          <div class="section-header">
            <div class="section-title">${categoryMap[catKey].title}</div>
          </div>
          <div class="cards-grid">
            ${catItems.map((item) => `
              <a class="nav-card" href="https://${item.domain}" target="_blank" rel="noopener noreferrer" data-domain="${item.domain.toLowerCase()}" data-name="${item.name.toLowerCase()}">
                <button class="card-del-btn" title="删除该网址" data-domain="${item.domain}" aria-label="删除">&times;</button>
                <div class="card-top">
                  <img class="card-icon" src="https://icons.duckduckgo.com/ip3/${item.domain}.ico" alt="" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_ICON}'" />
                  <div class="card-info">
                    <div class="card-name" title="${item.name}">${item.name}</div>
                    <div class="card-domain">${item.domain}</div>
                  </div>
                </div>
                <div class="card-bottom">
                  <div class="status-badge">
                    <span>网络探测</span>
                    <div><span class="status-val status-icon pending">⏳</span> <span class="lat-val lat-text"></span></div>
                  </div>
                </div>
              </a>
            `).join('')}
          </div>
        `;
        navSections.appendChild(section);
      });
    }

    function probeDomain(domain) {
      return new Promise((resolve) => {
        const start = performance.now();
        let finished = false;
        const ctrl = new AbortController();
        const img = new Image();
        const finish = (ok) => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          try { ctrl.abort(); } catch (e) {}
          try { img.src = ''; } catch (e) {}
          resolve({ ok, lat: performance.now() - start });
        };
        const timer = setTimeout(() => finish(false), 3500);

        img.onload = () => finish(true);
        img.onerror = () => { if (performance.now() - start < 3200) finish(true); };
        img.src = 'https://' + domain + '/favicon.ico?_t=' + Math.random();

        fetch('https://' + domain, { mode: 'no-cors', cache: 'no-cache', signal: ctrl.signal })
          .then(() => finish(true))
          .catch(() => { if (performance.now() - start < 3200) finish(true); });
      });
    }

    async function runSpeedTest() {
      if (testBtn.disabled) return;
      testBtn.disabled = true;
      testBtn.style.opacity = '0.6';
      testBtn.textContent = '⏳ 正在探测…';

      const cards = Array.from(document.querySelectorAll('.nav-card'));
      const probeCache = {};
      let i = 0;
      const concurrency = 20;
      const workers = [];

      for (let w = 0; w < concurrency; w++) {
        workers.push((async function worker() {
          while (i < cards.length) {
            const idx = i++;
            const card = cards[idx];
            if (!card) break;
            const domain = card.dataset.domain;

            let res = probeCache[domain];
            if (!res) {
              res = await probeDomain(domain);
              probeCache[domain] = res;
            }

            const iconEl = card.querySelector('.status-icon');
            const latEl = card.querySelector('.lat-text');

            if (iconEl && latEl) {
              iconEl.textContent = res.ok ? '✔' : '✖';
              iconEl.className = 'status-val status-icon ' + (res.ok ? 'ok' : 'fail');
              if (res.ok && !isNaN(res.lat)) {
                const ms = Math.round(res.lat);
                latEl.textContent = `${ms}ms`;
                latEl.className = 'lat-val lat-text ' + (ms < 100 ? 'good' : (ms < 300 ? 'med' : 'bad'));
              } else {
                latEl.textContent = '';
              }
            }
            card.className = 'nav-card ' + (res.ok ? 'status-success' : 'status-fail');
          }
        })());
      }

      await Promise.all(workers);
      testBtn.disabled = false;
      testBtn.style.opacity = '1';
      testBtn.textContent = '⚡ 重新测速';
    }

    navSections.addEventListener('click', (e) => {
      const delBtn = e.target.closest('.card-del-btn');
      if (!delBtn) return;
      e.preventDefault();
      e.stopPropagation();
      const domain = delBtn.dataset.domain;
      if (confirm(`确定要从导航中移除 ${domain} 吗？`)) {
        currentResourceData = currentResourceData.filter(item => item.domain.toLowerCase() !== domain.toLowerCase());
        saveResourceDataset(currentResourceData);
        renderNavGrid();
      }
    });

    function showModal() { addModal.classList.add('show'); document.getElementById('inputName').focus(); }
    function hideModal() { addModal.classList.remove('show'); addSiteForm.reset(); }

    addSiteBtn.addEventListener('click', showModal);
    modalCloseBtn.addEventListener('click', hideModal);
    modalCancelBtn.addEventListener('click', hideModal);
    addModal.addEventListener('click', (e) => { if (e.target === addModal) hideModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && addModal.classList.contains('show')) hideModal(); });

    addSiteForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('inputName').value.trim();
      let domain = document.getElementById('inputDomain').value.trim();
      const cat = document.getElementById('selectCat').value;

      domain = domain.replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
      if (!name || !domain) return;

      const exists = currentResourceData.some(item => item.domain.toLowerCase() === domain.toLowerCase());
      if (exists) { alert(`域名 ${domain} 已存在于导航列表中！`); return; }

      currentResourceData.unshift({ name, domain, cat });
      saveResourceDataset(currentResourceData);
      renderNavGrid();
      hideModal();
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('确定要重置为默认初始预设列表吗？您自定义添加和删除的数据将被清空。')) {
        localStorage.removeItem(STORAGE_KEY);
        currentResourceData = [...defaultResourceData];
        renderNavGrid();
      }
    });

    categoryTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.dataset.cat;
      document.querySelectorAll('.nav-section').forEach(sec => {
        sec.style.display = (cat === 'all' || sec.dataset.category === cat) ? 'block' : 'none';
      });
    });

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.nav-card').forEach(card => {
        const name = card.dataset.name || '';
        const domain = card.dataset.domain || '';
        card.classList.toggle('hidden', !!q && !name.includes(q) && !domain.includes(q));
      });
    });

    darkToggle.addEventListener('change', (e) => {
      document.body.classList.toggle('dark', e.target.checked);
      localStorage.setItem('darkMode', e.target.checked ? '1' : '0');
    });

    if (localStorage.getItem('darkMode') === '1') {
      darkToggle.checked = true;
      document.body.classList.add('dark');
    }

    testBtn.addEventListener('click', runSpeedTest);

    /* ---------- PWA: 纯单文件实现（内联 manifest / 图标 / Service Worker） ---------- */
    let deferredPrompt = null;
    const installPrompt = document.getElementById('installPrompt');
    const installBtn = document.getElementById('installBtn');
    const installDismiss = document.getElementById('installDismiss');

    // 内联 SVG 图标（同时用于 apple-touch-icon 与 manifest）
    const ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#0040dd"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#bg)"/><g transform="translate(256 256)"><path d="M0 -120 C 34 -120 60 -94 60 -60 L 0 70 L -60 -60 C -60 -94 -34 -120 0 -120 Z" fill="#ffffff"/><circle cx="0" cy="-78" r="14" fill="#0a84ff"/><path d="M0 70 C 30 70 56 92 70 120 C 40 132 18 138 0 138 C -18 138 -40 132 -70 120 C -56 92 -30 70 0 70 Z" fill="#ff9f0a"/></g></svg>`;
    const ICON_DATA_URI = 'data:image/svg+xml,' + encodeURIComponent(ICON_SVG);

    document.getElementById('favicon').href = ICON_DATA_URI;
    document.getElementById('appleTouchIcon').href = ICON_DATA_URI;

    // 内联 manifest（Blob URL）
    const manifestObj = {
      name: '极客开发导航 & 连通性测试中心',
      short_name: 'GeekNav',
      description: '支持自由增删网址、浏览器本地持久化保存的极客开发导航与连通性测试中心',
      lang: 'zh-CN',
      start_url: '.',
      scope: '.',
      display: 'standalone',
      orientation: 'any',
      background_color: '#f5f5f7',
      theme_color: '#f5f5f7',
      categories: ['utilities', 'productivity', 'developer'],
      icons: [
        { src: ICON_DATA_URI, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
        { src: ICON_DATA_URI, sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
    document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);

    function showInstallPrompt() {
      if (!deferredPrompt) return;
      if (localStorage.getItem('pwaDismissed') === '1') return;
      if (window.matchMedia('(display-mode: standalone)').matches) return;
      installPrompt.classList.add('show');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(showInstallPrompt, 2500);
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installPrompt.classList.remove('show');
    });

    installDismiss.addEventListener('click', () => {
      installPrompt.classList.remove('show');
      localStorage.setItem('pwaDismissed', '1');
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      installPrompt.classList.remove('show');
    });

    // Service Worker 注册（离线增强）
    // 优先使用同目录的 sw.js（真正支持离线冷启动）；
    // 若仅单文件部署、无 sw.js，则尝试内联 Blob SW 作为尽力而为的渐进增强
    // （注意：多数浏览器会拒绝 blob: 形式 SW 脚本，此时自动回退为纯在线）。
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        const tryBlobSW = () => {
          const swCode = `
            const CACHE = 'geeknav-v1';
            self.addEventListener('install', (e) => {
              e.waitUntil(caches.open(CACHE).then((c) =>
                c.add(new Request('./', { cache: 'reload' })).catch(() => {})
              ));
              self.skipWaiting();
            });
            self.addEventListener('activate', (e) => {
              e.waitUntil(caches.keys().then((keys) =>
                Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k)))
              ));
              self.clients.claim();
            });
            self.addEventListener('fetch', (e) => {
              const req = e.request;
              if (req.method !== 'GET') return;
              e.respondWith(
                caches.match(req).then((cached) => cached || fetch(req)
                  .then((res) => {
                    if (res.ok && res.type === 'basic') {
                      const copy = res.clone();
                      caches.open(CACHE).then((c) => c.put(req, copy));
                    }
                    return res;
                  })
                  .catch(() => cached)
                )
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          return navigator.serviceWorker.register(swUrl).catch(() => {});
        };

        // 先探测同目录 sw.js 是否存在
        fetch('./sw.js', { method: 'HEAD' })
          .then((r) => {
            if (r.ok) return navigator.serviceWorker.register('./sw.js').catch(() => {});
            return tryBlobSW();
          })
          .catch(() => tryBlobSW());
      });
    }

    /* 背景光晕跟随鼠标（桌面端，GPU transform 平滑插值） */
    const glowEls = [
      document.querySelector('.bg-glow-a'),
      document.querySelector('.bg-glow-b'),
      document.querySelector('.bg-glow-c')
    ];
    const glowOffsets = [[0, 0], [-12, 3], [12, -3]];
    let glowTargetX = 50, glowTargetY = 50;
    let glowCurX = 50, glowCurY = 50;
    let glowRaf = null;
    document.addEventListener('mousemove', (e) => {
      glowTargetX = (e.clientX / window.innerWidth) * 100;
      glowTargetY = (e.clientY / window.innerHeight) * 100;
      if (!glowRaf) glowRaf = requestAnimationFrame(glowTick);
    }, { passive: true });
    function glowTick() {
      glowCurX += (glowTargetX - glowCurX) * 0.25;
      glowCurY += (glowTargetY - glowCurY) * 0.25;
      for (let i = 0; i < glowEls.length; i++) {
        if (glowEls[i]) {
          const x = glowCurX + glowOffsets[i][0];
          const y = glowCurY + glowOffsets[i][1];
          glowEls[i].style.transform =
            `translate(calc(-50% + ${x - 50}vw), calc(-50% + ${y - 50}vh))`;
        }
      }
      if (Math.abs(glowTargetX - glowCurX) > 0.02 || Math.abs(glowTargetY - glowCurY) > 0.02) {
        glowRaf = requestAnimationFrame(glowTick);
      } else {
        glowRaf = null;
      }
    }

    renderNavGrid();
  </script>
</body>
</html>
